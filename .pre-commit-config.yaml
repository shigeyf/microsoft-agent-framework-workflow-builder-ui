# .pre-commit-config.yaml
#
#  Pre-commit configuration file
#  To install pre-commit executable command via pip: pip install pre-commit
#  To install the git hooks, run: pre-commit install --install-hooks
#  See https://pre-commit.com/ for more details

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        name: "[Fmt]  Fix end of files"
      - id: trailing-whitespace
        name: "[Fmt]  Fix trailing whitespaces"

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        name: "[Lint] Markdownlint (*.md)"
        args: ["--config", ".markdownlint.yaml"]

  - repo: local
    hooks:
      - id: ui-format-check
        name: "[Fmt]  Prettier check (src/ui)"
        entry: bash -c 'cd src/ui && npm run format:check'
        language: system
        pass_filenames: false
        files: ^src/ui/.*\.(css|html|json|md|ts|tsx)$

      - id: ui-oxlint
        name: "[Lint] Oxlint (src/ui)"
        entry: bash -c 'cd src/ui && node ./node_modules/oxlint/dist/cli.js .'
        language: system
        pass_filenames: false
        files: ^src/ui/.*\.(js|jsx|ts|tsx)$

#  - repo: https://github.com/pre-commit/pre-commit-hooks
#    rev: v6.0.0
#    hooks:
#      - id: pretty-format-json
#        name: "[Fmt]  Pretty format JSON (*.json)"
#        args: ["--autofix", "--indent", "2", "--no-sort-keys"]
#        types_or: [json]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        name: "[Lint] check-yaml (*.yml,*.yaml)"
        types_or: [yaml]

