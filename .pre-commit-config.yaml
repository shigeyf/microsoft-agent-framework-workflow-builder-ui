#        args: ["--autofix", "--indent", "2", "--no-sort-keys"]
#        types_or: [json]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        name: "[Lint] check-yaml (*.yml,*.yaml)"
        types_or: [yaml]

